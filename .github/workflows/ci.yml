name: Docker CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-first-image:${{ github.sha }} .

      - name: Run container as a test
        run: |
          docker run -d -p 8080:80 --name test-container my-first-image:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8080 || exit 1
          docker stop test-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        run: |
          docker tag my-first-image:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/docker-lab:${{ github.sha }}
          docker tag my-first-image:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/docker-lab:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/docker-lab:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/docker-lab:latest
